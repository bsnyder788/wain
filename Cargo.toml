[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
wain-core = { path = "crates/wain-core" }
wain-vision = { path = "crates/wain-vision" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1

# Keep the WebAssembly bundle small.
[profile.release.package.wain-wasm]
opt-level = "s"
