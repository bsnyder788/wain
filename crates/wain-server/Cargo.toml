[package]
name = "wain-server"
description = "HTTP API for wain."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Derives TypeScript bindings for the API types; see scripts/build-engine.sh.
ts = ["dep:ts-rs", "wain-core/ts"]

[dependencies]
wain-core.workspace = true
serde.workspace = true
serde_json.workspace = true
axum = { version = "0.8", features = ["multipart"] }
axum-extra = { version = "0.12", features = ["cookie"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "macros"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
sha2 = "0.11"
subtle = "2"
getrandom = "0.4"
base64 = "0.23"
dotenvy = "0.15"
ts-rs = { version = "12", optional = true, features = ["uuid-impl"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
